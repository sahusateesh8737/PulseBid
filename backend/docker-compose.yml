version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: auction_db
    environment:
      POSTGRES_DB: auction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auction_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auction_network

  redis:
    image: redis:7-alpine
    container_name: auction_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auction_network

  api:
    build: .
    container_name: auction_api
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/auction_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PORT=4000
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - auction_network

  ws-gateway:
    build: .
    command: node src/ws/gateway.js
    container_name: auction_ws_gateway
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/auction_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PORT=4001
    depends_on:
      - postgres
      - redis
    networks:
      - auction_network

  prometheus:
    image: prom/prometheus:latest
    container_name: auction_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - auction_network

  grafana:
    image: grafana/grafana:latest
    container_name: auction_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards/json
    depends_on:
      - prometheus
    networks:
      - auction_network

volumes:
  postgres_data:
  redis_data:
  prometheus-data:
  grafana-data:

networks:
  auction_network:
    driver: bridge
